<!doctype html>
<html lang="zh-CN" class="force-landscape">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>准备好了吗？</title>
  <link rel="stylesheet" href="./mobile-landscape.css">
  <script src="./mobile-fullscreen.js" defer></script>
  <style>
    @font-face {
      font-family: "Fusion Pixel";
      src: url("./assets/fonts/fusion-pixel-12px-proportional-zh_hans.woff2") format("woff2");
      font-display: swap;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      color: #ffe6a3;
      font-family: "Fusion Pixel", "Microsoft YaHei", Arial, sans-serif;
      overflow: hidden;
    }

    .scene {
      width: min(92vw, 720px);
      padding: 36px;
      text-align: center;
      background: #7b4428;
      border: 6px solid #3b1c12;
      box-shadow: inset 0 0 0 5px #d7964e, 0 10px 0 #26120c;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .scene.show {
      opacity: 1;
      transform: scale(1);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    button {
      min-height: 42px;
      padding: 0 18px;
      border: 3px solid #4b2517;
      background: #f2b766;
      color: #3f2114;
      box-shadow: inset 0 0 0 3px #ffd080, 0 4px 0 #2a120b;
      font: inherit;
    }

    .fade {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 700ms ease;
    }

    .fade.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <main id="scene" class="scene">
    <h1>准备好了吗？</h1>
    <button id="openButton" type="button">打开电子信</button>
  </main>
  <div id="fade" class="fade"></div>

  <script>
    requestAnimationFrame(() => document.querySelector("#scene").classList.add("show"));
    document.querySelector("#openButton").addEventListener("click", () => {
      document.querySelector("#fade").classList.add("show");
      setTimeout(() => { location.href = "electronic_letter.html"; }, 760);
    });
  </script>
</body>
</html>
