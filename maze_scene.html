<!doctype html>
<html lang="zh-CN" class="force-landscape">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>秋实 · 迷宫</title>
  <link rel="stylesheet" href="./mobile-landscape.css">
  <script src="./mobile-fullscreen.js" defer></script>
  <style>
    @font-face {
      font-family: "Fusion Pixel";
      src: url("./assets/fonts/fusion-pixel-12px-proportional-zh_hans.woff2") format("woff2");
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #24140d;
      color: #ffe6a3;
      font-family: "Fusion Pixel", "Microsoft YaHei", Arial, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(100vw, 102.42dvh);
      aspect-ratio: 1269 / 1239;
      border: 5px solid #3b1c12;
      box-shadow: 0 0 0 4px #b9763d, 0 10px 0 #140907;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .top-button,
    .complete,
    .pad button,
    .next-button {
      border: 3px solid #4b2517;
      background: #d99045;
      color: #35190f;
      box-shadow: inset 0 0 0 3px #f0bd68, 0 4px 0 #2a120b;
      font: inherit;
    }

    .top-button {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 3;
      min-height: 36px;
      padding: 0 14px;
    }

    .complete {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: 260px;
      padding: 18px 22px;
      text-align: center;
      z-index: 4;
    }

    .reward-image {
      display: block;
      width: 50%;
      max-width: 140px;
      margin: 10px auto 0;
      image-rendering: pixelated;
    }

    .reward-name {
      margin-top: 8px;
    }

    .next-button {
      margin-top: 14px;
      min-height: 36px;
      padding: 0 14px;
    }

    .hidden {
      display: none;
    }

    .pad {
      position: fixed;
      right: calc((100vw - min(100vw, 102.42dvh)) / 2 + max(18px, env(safe-area-inset-right)));
      top: 50%;
      bottom: auto;
      transform: translateY(-50%);
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 6px;
      z-index: 5;
      opacity: 0.48;
    }

    .pad:active,
    .pad:hover {
      opacity: 0.84;
    }

    .pad button {
      padding: 0;
      font-size: 20px;
    }

    .up { grid-column: 2; }
    .left { grid-column: 1; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
    .down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>
  <main class="stage">
    <button class="top-button" type="button" onclick="location.href='autumn_harvest_scene.html'">返回</button>
    <canvas id="mazeCanvas"></canvas>
    <div id="complete" class="complete hidden">
      <div>恭喜得到最后一张贴纸</div>
      <img class="reward-image" src="./assets/autumn-vn/story-book.png" alt="故事书">
      <div class="reward-name">故事书</div>
      <button class="next-button" type="button" onclick="location.href='letter_ready_scene.html'">继续</button>
    </div>
  </main>

  <div class="pad" aria-label="方向键">
    <button class="up" data-key="ArrowUp">↑</button>
    <button class="left" data-key="ArrowLeft">←</button>
    <button class="right" data-key="ArrowRight">→</button>
    <button class="down" data-key="ArrowDown">↓</button>
  </div>

  <script type="module">
    import { MazeScene } from "./maze-scene.js";

    new MazeScene(
      document.querySelector("#mazeCanvas"),
      document.querySelector("#complete")
    ).start();

    for (const button of document.querySelectorAll("[data-key]")) {
      const key = button.dataset.key;
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        window.dispatchEvent(new KeyboardEvent("keydown", { key }));
      });
      button.addEventListener("pointerup", () => {
        window.dispatchEvent(new KeyboardEvent("keyup", { key }));
      });
      button.addEventListener("pointercancel", () => {
        window.dispatchEvent(new KeyboardEvent("keyup", { key }));
      });
    }
  </script>
</body>
</html>
